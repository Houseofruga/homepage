<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>House of Ruga</title>
  <meta name="description" content="House of Ruga — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --border: #e6e2da;
      --ink: #1a1a17;
      --ink-3: #6e6b63;
      --ink-faint: #a8a49a;
      --accent: #9ff50a;
      --accent-line: #d6f59b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 480px;
      padding-top: 24px;
      padding-bottom: 24px;
    }

    .mark {
      width: 14px;
      height: 14px;
      background: var(--accent);
      margin: 0 auto 28px auto;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 14px 0;
    }

    p {
      font-size: 17px;
      line-height: 1.5;
      color: var(--ink-3);
      margin: 0;
    }

    /* ------------------------------------------------ product catalogue */

    .catalogue {
      width: 100%;
      max-width: 480px;
      padding-bottom: 40px;
    }

    .catalogue-label {
      font-size: 11px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
      text-align: center;
    }

    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
    }

    .product-card:hover {
      border-color: var(--accent-line);
      text-decoration: none;
    }

    .product-card img {
      height: 28px;
      width: auto;
      display: block;
    }

    .product-card .arrow {
      font-size: 18px;
      color: var(--ink-faint);
      transition: transform 0.15s ease;
    }

    .product-card:hover .arrow {
      transform: translateX(3px);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div>
      <div class="mark"></div>
      <h1>House of Ruga</h1>
      <p>Something&rsquo;s brewing. Check back soon.</p>
    </div>
  </div>

  <div class="catalogue">
    <div class="catalogue-label">Product catalogue</div>
    <a class="product-card" href="/trailwatch">
      <img src="/trailwatch/logo.svg" alt="Trailwatch" />
      <span class="arrow">&rarr;</span>
    </a>
  </div>
</body>
</html>
