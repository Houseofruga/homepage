<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>House of Ruga</title>
  <meta name="description" content="House of Ruga — coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f5f5f5;
      --ink: #1a1a17;
      --ink-3: #6e6b63;
      --accent: #9ff50a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      text-align: center;
      max-width: 480px;
    }

    .mark {
      width: 14px;
      height: 14px;
      background: var(--accent);
      margin: 0 auto 28px auto;
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 14px 0;
    }

    p {
      font-size: 17px;
      line-height: 1.5;
      color: var(--ink-3);
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>House of Ruga</h1>
    <p>Something&rsquo;s brewing. Check back soon.</p>
  </main>
</body>
</html>
